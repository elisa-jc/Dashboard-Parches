services:
  backend:
    build:
      context: ./backend
    environment:
      DATA_DIR: /data
    volumes:
      - ./tablas_limpias:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    depends_on:
      - backend
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
